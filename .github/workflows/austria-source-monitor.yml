name: Austria source monitor

on:
  schedule:
    - cron: '37 3 1 * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: austria-source-monitor
  cancel-in-progress: false

jobs:
  check-official-sources:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.12'

      - name: Prepare review branch
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          UPDATE_BRANCH: monitor/austria-source-updates
        run: |
          git fetch origin "$DEFAULT_BRANCH"
          if git ls-remote --exit-code --heads origin "$UPDATE_BRANCH" >/dev/null 2>&1; then
            git fetch origin "$UPDATE_BRANCH"
            git switch --force-create "$UPDATE_BRANCH" "origin/$UPDATE_BRANCH"
            git merge --no-edit "origin/$DEFAULT_BRANCH"
          else
            git switch --create "$UPDATE_BRANCH" "origin/$DEFAULT_BRANCH"
          fi

      - name: Check Austria sources and stage changes for review
        id: sync
        run: python source-library/austria/sync_austria_sources.py

      - name: Create or update review pull request
        if: steps.sync.outputs.pending == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          UPDATE_BRANCH: monitor/austria-source-updates
        run: |
          git config user.name eudirective
          git config user.email eudirective@proton.me
          git status --porcelain -- source-library/austria/pending-updates/ > "$RUNNER_TEMP/austria-pending-status.txt"
          if [ -s "$RUNNER_TEMP/austria-pending-status.txt" ]; then
            git add source-library/austria/pending-updates/
            git commit -m "Stage Austria source changes for review"
            git push origin "HEAD:refs/heads/$UPDATE_BRANCH"
          fi
          if ! gh pr view "$UPDATE_BRANCH" --json url >/dev/null 2>&1; then
            cat > "$RUNNER_TEMP/austria-pr-body.md" <<'EOF'
          The scheduled Austria source check found changed official source bytes and staged the exact captures and derived candidates under `source-library/austria/pending-updates/`.

          Review source identity, effective version, linked materials, extraction quality, and reuse terms before promoting any candidate. This workflow never accepts or replaces source content automatically and does not use the RIS OGD/API.
          EOF
            gh pr create \
              --base "$DEFAULT_BRANCH" \
              --head "$UPDATE_BRANCH" \
              --title "Review Austria source updates" \
              --body-file "$RUNNER_TEMP/austria-pr-body.md"
          fi
